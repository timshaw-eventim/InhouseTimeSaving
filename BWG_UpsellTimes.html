<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Event Time Helper</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    body {
      background: #f2f3f8;
      min-height: 100vh;
      padding: 30px 10px;
      background: url("https://testshop005.eventim-inhouse.co.uk/webshop/substituteplans/eventim_background.jpg") no-repeat center center fixed !important;
background-size: cover !important;
    }

    .input-time {
      font-size: 3em;
      font-weight:bold;
    }

    .input-time::placeholder {
      font-size: 20px;
      color: #D3D3D3;
      line-height: 3em;
      font-weight:unset;
      font-style: italic;
    }

    .time-cell {
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size:18px;
    }

    .output {
      font-size: 36px;
         font-weight:bold;
    }
  </style>
</head>
<body>

<div style="text-align:center">
<a href="https://timshaw-eventim.github.io/InhouseTimeSaving/"><img src="https://testshop005.eventim-inhouse.co.uk/webshop/substituteplans/eventim_logo.jpg" style="width:200px;margin-bottom:20px;"></a>
</div>

  <div class="card custom mx-auto" style="max-width:980px;">
      
    <div class="card-body text-center">

  <div class="container text-center">
    <h2 class="mb-4">Blackpool Upsell Timings</h2>

    <div class="row justify-content-center" id="rows"></div>

    <button id="addRow" class="btn btn-primary mt-3">+ Add Another Event Time</button>
  </div>
  </div>
    </div>


<script>
const OFFSETS = {
  minus60: -60,
  minus45a: -45,
  minus45b: -45,
  asperf: 0
};

// ---- Time utilities ----
function parseInputToMinutes(s) {
  if (!s) return null;
  s = s.toString().trim();
  if (s === '') return null;

  const colon = s.match(/^(\d{1,2}):(\d{1,2})$/);
  if (colon) {
    let hh = +colon[1], mm = +colon[2];
    if (hh<0||hh>23||mm<0||mm>59) return null;
    return hh*60 + mm;
  }

  const digits = s.replace(/\D/g,'');
  if (digits.length <= 2) return +digits*60;
  if (digits.length === 3) return +(digits[0])*60 + +(digits.slice(1));
  const mm = +digits.slice(-2);
  const hh = +digits.slice(0, -2);
  if (hh<0||hh>23||mm<0||mm>59) return null;
  return hh*60 + mm;
}

function minutesToHHMM(m) {
  if (m==null) return '--:--';
  const total = ((m % (24*60)) + (24*60)) % (24*60);
  const hh = Math.floor(total/60), mm = total%60;
  return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}

function computeTimes(inputStr) {
  const base = parseInputToMinutes(inputStr);
  if (base==null) return {minus60:'--:--',minus45a:'--:--',minus45b:'--:--',asperf:'--:--'};
  return {
    minus60: minutesToHHMM(base + OFFSETS.minus60),
    minus45a: minutesToHHMM(base + OFFSETS.minus45a),
    minus45b: minutesToHHMM(base + OFFSETS.minus45b),
    asperf: minutesToHHMM(base + OFFSETS.asperf)
  };
}

// ---- UI ----
let nextId=1;
function addRow(initial='', focus=true) {
  const id = nextId++;
  const $row = $(`
    <div class="col-md-6 col-lg-4 mb-4">
      <div class="card p-3 text-center shadow-sm" data-id="${id}">
        <input class="form-control form-control-lg mb-3 text-center input-time" value="${initial}" placeholder="Add Event Start Time" minlength="4" maxlength="5"/>
        <div class="d-grid gap-2">
          <div class="time-cell rounded p-3 bg-warning bg-opacity-25">
            <div class="fw-bold99">Transport</div>
            <div class="output fixed-time">--:--</div>
          </div>
          <div class="time-cell rounded p-3 bg-danger bg-opacity-25">
            <div class="fw-bold99">Eventim Lounge</div>
            <div class="output minus60-time">--:--</div>
          </div>
          <div class="time-cell rounded p-3 bg-info bg-opacity-25">
            <div class="fw-bold99">VIP Booth</div>
            <div class="output minus45a-time">--:--</div>
          </div>
          <div class="time-cell rounded p-3 bg-info bg-opacity-25">
            <div class="fw-bold99">Pre-show Wine</div>
            <div class="output minus45b-time">--:--</div>
          </div>
          <div class="time-cell rounded p-3 bg-success bg-opacity-25">
            <div class="fw-bold99">Interval Wine</div>
            <div class="output asperf-time">--:--</div>
          </div>
        </div>
      </div>
    </div>
  `);
  $('#rows').append($row);
  $row.find('.input-time').on('input', () => updateRow($row));
  if(focus) $row.find('.input-time').focus();
  updateRow($row);
}

function updateRow($row){
  let val = $row.find('.input-time').val().trim();

  const digits = val.replace(/\D/g,''); 
  if(digits.length === 4) {
    let hh = digits.slice(0,2);
    let mm = digits.slice(2,4);
    if(parseInt(hh) > 23) hh = '23';
    if(parseInt(mm) > 59) mm = '59';
    val = hh + ':' + mm;
    $row.find('.input-time').val(val);
  }

  if(!val) {
    $row.find('.fixed-time').text('--:--');
    $row.find('.minus60-time').text('--:--');
    $row.find('.minus45a-time').text('--:--');
    $row.find('.minus45b-time').text('--:--');
    $row.find('.asperf-time').text('--:--');
    return;
  }

  const d = computeTimes(val);
  $row.find('.fixed-time').text('12:00'); 
  $row.find('.minus60-time').text(d.minus60);
  $row.find('.minus45a-time').text(d.minus45a);
  $row.find('.minus45b-time').text(d.minus45b);
  $row.find('.asperf-time').text(d.asperf);
}

$(function(){
  $('#addRow').on('click', ()=> addRow('', true));
  addRow('', false);  
  addRow('', false);  
  $('#rows .card:first .input-time').focus();
});
</script>
</body>
</html>
