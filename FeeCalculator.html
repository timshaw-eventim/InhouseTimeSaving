<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ticketing Fee Calculator</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f2f3f8;
      font-family: Arial, Helvetica, sans-serif;
      padding: 30px 10px;
background: url("https://testshop005.eventim-inhouse.co.uk/webshop/substituteplans/eventim_background.jpg") no-repeat center center fixed !important;
background-size: cover !important;
}

  
    h1 { font-size: 28px; color: #333; }
    .card.custom { border-radius: 12px; box-shadow: 0 6px 18px rgba(17,24,39,0.06); }
    thead th { background: #fbfdff; font-weight: 600; }
    .muted { color: #667085; font-size: 13px; text-align: center; }
    .note { font-size: 12px; color: #475569; margin-top: 8px; text-align: center; }
    .btn-sm-custom { padding: 6px 8px; font-size: 13px; }
        input.rrp { max-width: 140px; margin-left: auto; margin-right: auto;background:#ffe0cc; }

    /* Remove spinner arrows for number inputs */
    .no-spinner::-webkit-inner-spin-button,
    .no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .no-spinner { -moz-appearance: textfield; }

    /* calc-face hidden by default */
    .calc-face { visibility: hidden; text-align: center; }

    /* inner box for highlight with padding */
    .highlight-box {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 10px;
      visibility: hidden;
    }
    .highlight-box.highlight {
      background-color: #d4edda !important;
      font-weight: bold;
      color: #155724 !important;
            display: inline-block;
      border-radius: 10px;
      visibility:visible;
      padding: 4px 30%;
    }

    .reductionused {
      background-color: #d4edda !important;
    }

    ::placeholder {font-style: italic;color:red;}

  </style>
</head>
<body>

  <div style="text-align:center">
<img src="https://testshop005.eventim-inhouse.co.uk/webshop/substituteplans/eventim_logo.jpg" style="width:200px;margin-bottom:20px;">
</div>

<div class="container">
  
 
  <div class="card custom mx-auto" style="max-width:980px;">
      
    <div class="card-body text-center">


  <h1 class="text-center mb-4">Ticketing Fee Calculator</h1>

      <div class="p-3 mb-4 bg-light border rounded">
      <h5 >Calculation Rules</h5>
      
      <form class="row gx-3 gy-2 justify-content-center" onsubmit="return false;">
        <div class="col-auto">
          <label for="reduction" class="form-label small">Price Reduction</label>
          <input id="reduction" type="text" class="form-control form-control-sm text-center" placeholder="e.g. 5.00 or 50%">
        </div>

        <div class="col-auto">
          <label for="bookingFee" class="form-label small">Booking Fee %</label>
          <input id="bookingFee" type="number" step="0.01" value="12.5" class="form-control form-control-sm text-center no-spinner" style="width:110px;">
        </div>

        <div class="col-auto">
          <label for="levy" class="form-label small">Restoration Levy</label>
          <input id="levy" type="number" step="0.01" value="1.95" class="form-control form-control-sm text-center no-spinner" style="width:110px;">
        </div>
      </form>
      </div>



      <div class="table-responsive">
        <table id="feesTable" class="table table-sm align-middle text-center mb-0">
          <colgroup>
            <col style="width:5%;">
            <col style="width:19%;">
            <col style="width:19%;">
            <col style="width:19%;">
            <col style="width:19%;">
            <col style="width:19%;">
          </colgroup>
          <thead>
            <tr>
              <th>#</th>
              <th>Face Value</th>
              <th>FV with Reduction</th>
              <th>Fee</th>
              <th>COI</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <!-- rows inserted by JS -->
          </tbody>
        </table>
      </div>

      <div class="d-flex gap-2 justify-content-center mt-5">
        <button id="removeRow" class="btn btn-outline-secondary btn-sm btn-sm-custom">− Remove last row</button>
        <button id="reset" class="btn btn-outline-secondary btn-sm btn-sm-custom">Reset</button>
        <button id="exportCSV" class="btn btn-outline-secondary btn-sm btn-sm-custom">Export CSV</button>
        <button id="addRow" class="btn btn-dark btn-sm btn-sm-custom">+ Add row</button>
      </div>

      <div class="note mt-3">
        If Price Reduction ends with "%" the reduction is applied as a percentage of the Face Value; otherwise it is treated as an absolute amount.
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  const tbody = document.getElementById('tbody');
  const addRowBtn = document.getElementById('addRow');
  const removeRowBtn = document.getElementById('removeRow');
  const bookingFeeInput = document.getElementById('bookingFee');
  const levyInput = document.getElementById('levy');
  const reductionInput = document.getElementById('reduction');
  const exportBtn = document.getElementById('exportCSV');
  const resetBtn = document.getElementById('reset');

  let rowCount = 0;

  function money(v){ return Number.isFinite(v) ? v.toFixed(2) : ''; }

  function parseReduction(raw, rrp){
    if(!raw) return 0;
    raw = String(raw).trim();
    if(raw.endsWith('%')){
      const p = parseFloat(raw.slice(0,-1));
      if(Number.isFinite(p)) return (rrp * p/100);
      return 0;
    }
    if(raw.includes('%')){
      const cleaned = raw.replace('%','');
      const p = parseFloat(cleaned);
      if(Number.isFinite(p)) return (rrp * p/100);
    }
    const n = parseFloat(raw);
    return Number.isFinite(n)? n : 0;
  }

  function recalcRow(tr){
    const rrpInput = tr.querySelector('.rrp');
    const rrpValRaw = rrpInput.value.trim();
    const calcFaceCell = tr.querySelector('.calc-face');
    const calcFaceDiv = calcFaceCell.querySelector('div');
    const feeCell = tr.querySelector('.fee');
    const coiCell = tr.querySelector('.coi');
    const totalCell = tr.querySelector('.total');

    if(rrpValRaw === ''){
      calcFaceDiv.textContent = '';
      calcFaceDiv.classList.remove('highlight');
      feeCell.textContent = '';
      coiCell.textContent = '';
      totalCell.textContent = '';
      return;
    }

    const rrp = parseFloat(rrpValRaw);
    if(!Number.isFinite(rrp)){
      calcFaceDiv.textContent = '';
      calcFaceDiv.classList.remove('highlight');
      feeCell.textContent = '';
      coiCell.textContent = '';
      totalCell.textContent = '';
      return;
    }

    const reductionRaw = reductionInput.value;
    const reductionAmount = parseReduction(reductionRaw, rrp);
    let calcFace = rrp - reductionAmount;
    if(!Number.isFinite(calcFace) || calcFace < 0) calcFace = 0;

    const bookingPercent = parseFloat(bookingFeeInput.value);
    const levy = parseFloat(levyInput.value);
    const fee = (Number.isFinite(bookingPercent) ? (calcFace/100)*bookingPercent : 0);
    const coi = fee + (Number.isFinite(levy) ? levy : 0);
    const total = calcFace + coi;

    calcFaceDiv.textContent = money(calcFace);
    if(reductionRaw.trim() !== ''){
      calcFaceDiv.classList.add('highlight');
      document.getElementById("reduction").classList.add('reductionused');
    } else {
      calcFaceDiv.classList.remove('highlight');
      document.getElementById("reduction").classList.remove('reductionused');
    }

    feeCell.textContent = money(fee);
    coiCell.textContent = money(coi);
    totalCell.textContent = money(total);
  }

  function addRow(initial){
    rowCount++;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="idx">${rowCount}</td>
      <td><input class="form-control form-control-sm text-center rrp no-spinner" type="number" step="0.01" placeholder="" /></td>
      <td class="calc-face"><div class="highlight-box"></div></td>
      <td class="fee"></td>
      <td class="coi"></td>
      <td class="total"></td>
    `;
    tbody.appendChild(tr);

    const rrpInput = tr.querySelector('.rrp');

    if(initial !== undefined) rrpInput.value = initial;

    rrpInput.addEventListener('blur', ()=> {
      if(rrpInput.value.trim() !== ''){
        let val = parseFloat(rrpInput.value);
        if(Number.isFinite(val)) rrpInput.value = val.toFixed(2);
      }
      recalcRow(tr);
    });

    rrpInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        const inputs = Array.from(document.querySelectorAll('input'));
        const index = inputs.indexOf(e.target);
        if(index > -1 && index < inputs.length - 1){
          inputs[index + 1].focus();
        }
      }
    });

    rrpInput.addEventListener('input', ()=> recalcRow(tr));
    bookingFeeInput.addEventListener('input', ()=> recalcRow(tr));
    levyInput.addEventListener('input', ()=> recalcRow(tr));
    reductionInput.addEventListener('input', ()=> recalcRow(tr));

    if(initial !== undefined && initial !== '') recalcRow(tr);
  }

  addRowBtn.addEventListener('click', ()=> addRow(''));
  removeRowBtn.addEventListener('click', ()=> {
    if(tbody.lastChild){
      tbody.removeChild(tbody.lastChild);
      rowCount = tbody.children.length;
      Array.from(tbody.children).forEach((r,i)=> r.querySelector('.idx').textContent = i+1);
    }
  });

  for(let i=0;i<6;i++) addRow('');

  exportBtn.addEventListener('click', ()=> {
    const rows = [];
    Array.from(tbody.children).forEach(tr=>{
      const rrp = tr.querySelector('.rrp').value;
      const calcFace = tr.querySelector('.calc-face div').textContent;
      const fee = tr.querySelector('.fee').textContent;
      const coi = tr.querySelector('.coi').textContent;
      const total = tr.querySelector('.total').textContent;
      rows.push({rrp, calcFace, fee, coi, total});
    });
    const header = ['Face Value','Face Value with Reduction','Fee','COI','Total'];
    const csv = [header.join(',')].concat(rows.map(r=>[
      r.rrp || '', r.calcFace || '', r.fee || '', r.coi || '', r.total || ''
    ].join(','))).join('\n');

    const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'fees.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });

  resetBtn.addEventListener('click', ()=> {
    reductionInput.value = '';
    bookingFeeInput.value = '12.5';
    levyInput.value = '1.95';
    tbody.innerHTML = '';
    rowCount = 0;
    for(let i=0;i<6;i++) addRow('');
  });
})();
</script>

</body>
</html>
